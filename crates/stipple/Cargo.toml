[package]
name = "stipple"
description = "Stipple: a cross-platform, self-drawn UI toolkit in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The raw GPU backends (`stipple::gpu`). Off by default.
gpu = []
# Each backend links system libraries, so each is opt-in. Without one, its entry
# points return an error.
gl = ["gpu"]  # EGL + GLES2
vk = ["gpu"]  # Vulkan (links libvulkan)
d3d = ["gpu"] # Direct3D 11, Windows-only
mtl = ["gpu"] # Metal, macOS-only

[dependencies]
oxideav-core.workspace = true
oxideav-raster.workspace = true
oxideav-scribe.workspace = true

[lints]
workspace = true
