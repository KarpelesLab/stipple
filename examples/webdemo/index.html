<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stipple on the web</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0b0d; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #report { display: none; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <pre id="report"></pre>
    <script type="module">
      // The whole page side is web/stipple.js, served next to this file.
      import { start } from "./stipple.js";

      const selftest = location.hash === "#selftest";
      // `#restore`: click, reload the tab, and check the count came back
      // (App::save_state, kept in sessionStorage).
      const restore = location.hash === "#restore";
      // CI reads the report from the server's request log: a GET of
      // `selftest-report?<report>` (a 404, but logged).
      const send = (text) => fetch(`selftest-report?${encodeURIComponent(text)}`).catch(() => {});
      // A failure (a wasm trap, a rejected promise) goes into the report, so
      // CI shows why the selftest stopped instead of an empty report.
      const fail = (what) => {
        const report = document.getElementById("report");
        report.textContent += `SELFTEST: FAILED (${what})\n`;
        console.log(`selftest error: ${what}`);
        send(report.textContent);
      };
      if (selftest || restore) {
        window.addEventListener("error", (ev) => fail(ev.message || ev.error));
        window.addEventListener("unhandledrejection", (ev) => fail(ev.reason?.stack || ev.reason));
      }
      // Where the selftest clicks, in CSS pixels (the demo's layout is fixed).
      const BUTTONS = { notes: 120, notesY: 58, counter: 85, open: 205, save: 287, y: 109 };
      const saved = [];
      const app = await start(document.getElementById("app"), "webdemo.wasm", {
        font: "font.ttf",
        // The selftest stands in for the file picker and the download.
        ...(selftest && {
          pickFile: async () => new File(["hello from a file\nsecond line\n"], "hello.txt"),
          saveFile: (name, blob) => saved.push([name, blob.size]),
        }),
      });
      if (selftest) runSelftest(app).catch((err) => fail(err?.stack || err));
      if (restore) runRestore(app).catch((err) => fail(err?.stack || err));

      // The state across a reload: the first load clicks the counter three
      // times and reloads (the page's `pagehide` saves the app's state into
      // sessionStorage); the second checks the app started with the count.
      async function runRestore({ exports: e, canvas }) {
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const probe = (i) => e.webdemo_probe(i);
        const MARK = "webdemo-restore";
        const first = sessionStorage.getItem(MARK);
        await sleep(300);
        if (first === null) {
          const fresh = probe(0);
          const r = canvas.getBoundingClientRect();
          for (let i = 0; i < 3; i++) {
            for (const type of ["pointermove", "pointerdown", "pointerup"]) {
              canvas.dispatchEvent(new PointerEvent(type, {
                clientX: r.left + BUTTONS.counter, clientY: r.top + BUTTONS.y, button: 0,
                buttons: type === "pointerup" ? 0 : 1, pointerId: 1, pointerType: "mouse", bubbles: true,
              }));
            }
            await sleep(50);
          }
          sessionStorage.setItem(MARK, JSON.stringify({ fresh, clicks: probe(0) }));
          location.reload();
          return;
        }
        sessionStorage.removeItem(MARK);
        const before = JSON.parse(first);
        const key = Object.keys(sessionStorage).find((k) => k.startsWith("stipple-state:"));
        const checks = [
          ["fresh-start", before.fresh === 0, `${before.fresh} clicks on the first load`],
          ["clicked", before.clicks === 3, `${before.clicks} clicks before the reload`],
          ["saved", !!key, `sessionStorage ${key ? `${key} = ${sessionStorage.getItem(key)}` : "has no state"}`],
          ["restored", probe(0) === before.clicks, `${probe(0)} clicks after the reload`],
        ];
        const ok = checks.every(([, pass]) => pass);
        const report = `SELFTEST: ${ok ? "ok" : "FAILED"}\n` +
          checks.map(([k, pass, detail]) => `${pass ? "ok    " : "FAILED"} ${k}: ${detail}`).join("\n");
        console.log(report);
        document.getElementById("report").textContent = report;
        send(report);
        document.title = `restore ${ok ? "ok" : "FAILED"}`;
      }

      // Drive the demo with DOM events, as a user would, and report what the
      // app saw (through `webdemo_probe`). CI loads `index.html#selftest` in
      // headless Chrome and reads the report from the DOM.
      async function runSelftest({ exports: e, stats, canvas, overlay, input, colorScheme }) {
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const probe = (i) => e.webdemo_probe(i);
        const checks = {};
        const check = (name, ok, detail) => { checks[name] = { ok: !!ok, detail }; };

        // HiDPI: the backing store is the CSS size times the pixel ratio.
        const dpr = window.devicePixelRatio;
        check("hidpi", canvas.width === Math.round(canvas.clientWidth * dpr),
          `${canvas.width}x${canvas.height} px for ${canvas.clientWidth}x${canvas.clientHeight} CSS px at ${dpr}x`);

        // Timers and the frame clock: the spinner turns at the display's rate
        // while the 1.5 s `after` timer runs, then frames stop.
        await sleep(1800);
        const loading = probe(5), ticks = probe(1);
        check("timer", probe(2) === 1 && ticks >= 2, `loaded=${probe(2)}, ${ticks} ticks of the 500 ms timer`);
        // Headless Chrome on a busy runner can manage well under 10 fps, so only ask
        // for clearly more builds than the timer alone causes.
        check("spinner", loading >= ticks + 5, `${loading} frames built while loading, ${stats.frames} animation frames`);
        const raf = stats.frames, idleBuilt = probe(6);
        await sleep(1000);
        check("idle", stats.frames - raf <= 2 && probe(6) - idleBuilt <= 4,
          `${stats.frames - raf} animation frames and ${probe(6) - idleBuilt} builds in 1 s idle`);

        const pointerOn = (cv, type, x, y) => {
          const r = cv.getBoundingClientRect();
          cv.dispatchEvent(new PointerEvent(type, {
            clientX: r.left + x, clientY: r.top + y, button: 0, buttons: type === "pointerup" ? 0 : 1,
            pointerId: 1, pointerType: "mouse", bubbles: true,
          }));
        };
        const clickOn = async (cv, x, y) => {
          for (const type of ["pointermove", "pointerdown", "pointerup"]) pointerOn(cv, type, x, y);
          await sleep(50);
        };
        const click = (x, y) => clickOn(canvas, x, y);
        // Keys go where the browser would send them: the focused element (the
        // overlay's textarea while the app has focus).
        const key = (k, opts = {}) => {
          (document.activeElement ?? document.body).dispatchEvent(
            new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...opts }));
        };
        const clip = (type, text) => {
          const data = new DataTransfer();
          if (text !== undefined) data.setData("text/plain", text);
          canvas.dispatchEvent(new ClipboardEvent(type, { clipboardData: data, bubbles: true, cancelable: true }));
          return data.getData("text/plain");
        };

        // Pointer: click the counter twice; the cursor turns to a hand over it.
        await click(BUTTONS.counter, BUTTONS.y);
        await click(BUTTONS.counter, BUTTONS.y);
        check("click", probe(0) === 2, `clicks=${probe(0)}, cursor=${canvas.style.cursor}`);
        check("cursor", canvas.style.cursor === "pointer", canvas.style.cursor);

        // Keyboard: focus the notes, type, select all and copy. Clicking the
        // canvas gives keyboard focus to the overlay's textarea, which the
        // focused field's ARIA element names.
        await click(BUTTONS.notes, BUTTONS.notesY);
        const field = overlay.querySelector("[role=textbox]");
        check("focus", document.activeElement === input && field
          && input.getAttribute("aria-labelledby") === field.id,
          `focused <${document.activeElement?.tagName?.toLowerCase()}>, labelled by ${input.getAttribute("aria-labelledby")}`);
        for (const k of "abc") key(k);
        key("Backspace");
        key("d");
        key("a", { ctrlKey: true });
        key("c", { ctrlKey: true });
        const copied = clip("copy");
        check("typing+copy", copied === "abd", `copied "${copied}"`);

        // Paste replaces the selection.
        clip("paste", "pasted!");
        await sleep(50);
        check("paste", probe(4) === 7, `notes length ${probe(4)}`);

        // Input methods: composition in the textarea shows a preedit (not yet
        // text), and the end commits it.
        const compose = (type, data) =>
          input.dispatchEvent(new CompositionEvent(type, { data, bubbles: true }));
        const before = probe(4);
        compose("compositionstart", "");
        compose("compositionupdate", "にほん");
        await sleep(50);
        const during = probe(4);
        compose("compositionupdate", "日本");
        compose("compositionend", "日本");
        await sleep(50);
        check("ime", during === before && probe(4) === before + 6,
          `${before} bytes, ${during} while composing, ${probe(4)} after committing 日本`);
        // A dead key: its keydown is left alone, and the composed character
        // arrives as an input event, typed once.
        key("Dead");
        input.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: "é", bubbles: true }));
        await sleep(50);
        check("dead-key", probe(4) === before + 8, `${probe(4)} bytes after Dead + "é"`);
        const copiedAll = (key("a", { ctrlKey: true }), key("c", { ctrlKey: true }), clip("copy"));
        check("ime-text", copiedAll === "pasted!日本é", `notes "${copiedAll}"`);

        // Files: open (async, back through the wake path) and save.
        await click(BUTTONS.open, BUTTONS.y);
        await sleep(200);
        check("open", probe(3) === 30, `opened ${probe(3)} bytes`);
        await click(BUTTONS.save, BUTTONS.y);
        check("save", saved.length === 1 && saved[0][0] === "notes.txt",
          JSON.stringify(saved));

        // Accessibility: the overlay mirrors the tree as ARIA elements; a
        // screen reader's "activate" (a click on the element) taps the node.
        const roles = [...overlay.querySelectorAll("[role]")]
          .map((el) => `${el.getAttribute("role")}:${el.textContent}`);
        const counterEl = [...overlay.querySelectorAll("[role=button]")]
          .find((el) => el.textContent.startsWith("Clicked"));
        const box = overlay.querySelector("[role=checkbox]");
        check("aria-tree", counterEl && box && box.getAttribute("aria-checked") === "false"
          && overlay.querySelector("[role=textbox]") && roles.includes("button:Save"),
          roles.join(", "));
        const clicks = probe(0);
        counterEl?.click();
        await sleep(50);
        check("aria-activate", probe(0) === clicks + 1 && counterEl?.textContent === `Clicked ${clicks + 1} times`,
          `clicks ${clicks} -> ${probe(0)}, button now "${counterEl?.textContent}"`);
        box?.click();
        await sleep(50);
        check("aria-checked", probe(8) === 1 && box?.getAttribute("aria-checked") === "true",
          `checked=${probe(8)}, aria-checked=${box?.getAttribute("aria-checked")}`);

        // prefers-color-scheme: the native theme follows it, and a change (as
        // the media query's change event reports it) re-themes the running app.
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches ? 1 : 0;
        const accent = CSS.supports("color", "AccentColor") ? (() => {
          const d = document.createElement("div");
          d.style.cssText = "display:none;color:AccentColor";
          document.body.append(d);
          const c = getComputedStyle(d).color;
          d.remove();
          return c;
        })() : "none";
        check("color-scheme", probe(7) === prefersDark,
          `prefers-color-scheme: ${prefersDark ? "dark" : "light"}, theme ${probe(7) ? "dark" : "light"}, AccentColor ${accent}`);
        // prefers-reduced-motion reaches the app, and decides whether a theme
        // change cross-fades (animation frames for 200 ms) or snaps (none).
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0;
        check("reduced-motion", probe(9) === reduce,
          `prefers-reduced-motion: ${reduce ? "reduce" : "no-preference"}, app ${probe(9) ? "reduces" : "animates"}`);
        const framesBefore = stats.frames;
        e.stipple_color_scheme(1 - prefersDark, -1);
        await sleep(400);
        const fadeFrames = stats.frames - framesBefore;
        const flipped = probe(7);
        check("theme-fade", reduce ? fadeFrames === 0 : fadeFrames >= 1,
          `${fadeFrames} animation frames after the theme changed (${reduce ? "snaps" : "cross-fades"})`);
        colorScheme();
        await sleep(400);
        check("theme-change", flipped === 1 - prefersDark && probe(7) === prefersDark,
          `theme ${flipped ? "dark" : "light"} after the scheme flipped, ${probe(7) ? "dark" : "light"} after it flipped back`);

        // Two apps on one page: a second canvas runs its own instance, which
        // renders and counts its own clicks.
        const second = document.createElement("canvas");
        second.style.cssText = "position:fixed;right:0;bottom:0;width:320px;height:200px";
        document.body.append(second);
        const app2 = await start(second, "webdemo.wasm", { font: "font.ttf", title: false });
        await sleep(100);
        const clicks1 = probe(0);
        await clickOn(second, BUTTONS.counter, BUTTONS.y);
        const px = second.getContext("2d").getImageData(0, 0, second.width, second.height).data;
        const colors = new Set();
        for (let i = 0; i < px.length; i += 16) colors.add((px[i] << 16) | (px[i + 1] << 8) | px[i + 2]);
        const p2 = (i) => app2.exports.webdemo_probe(i);
        check("two-apps", app2.stats.presents > 0 && colors.size > 10 && p2(0) === 1 && probe(0) === clicks1
          && app2.overlay !== overlay && app2.overlay.querySelector("[role=button]"),
          `second app: ${app2.stats.presents} presents, ${colors.size} colors, ${p2(0)} clicks; first app still ${probe(0)}`);
        second.remove();
        app2.overlay.remove();

        // Touch: fingers come as touch events (a phone's browser), which go
        // through the app's gestures: a tap taps, and a long press opens the
        // counter's context menu, whose item a tap then picks.
        if (typeof Touch === "function" && typeof TouchEvent === "function") {
          const touchOn = (type, id, x, y) => {
            const r = canvas.getBoundingClientRect();
            const t = new Touch({ identifier: id, target: canvas, clientX: r.left + x, clientY: r.top + y });
            const down = type === "touchstart" || type === "touchmove" ? [t] : [];
            canvas.dispatchEvent(new TouchEvent(type, {
              touches: down, targetTouches: down, changedTouches: [t], bubbles: true, cancelable: true,
            }));
          };
          const tapAt = async (id, x, y) => {
            touchOn("touchstart", id, x, y);
            touchOn("touchend", id, x, y);
            await sleep(100);
          };
          const before = probe(0);
          await tapAt(7, BUTTONS.counter, BUTTONS.y);
          check("touch-tap", probe(0) === before + 1, `clicks ${before} -> ${probe(0)}`);
          // Held past the long-press delay (half a second).
          touchOn("touchstart", 8, BUTTONS.counter, BUTTONS.y);
          let item = null;
          for (let i = 0; i < 40 && !item; i++) {
            await sleep(50);
            item = [...overlay.querySelectorAll("[role=menuitem]")].find((el) => el.textContent === "Add ten");
          }
          touchOn("touchend", 8, BUTTONS.counter, BUTTONS.y);
          await sleep(100);
          const heldClicks = probe(0);
          if (item) {
            const ir = item.getBoundingClientRect(), r = canvas.getBoundingClientRect();
            await tapAt(9, ir.left + ir.width / 2 - r.left, ir.top + ir.height / 2 - r.top);
          }
          check("touch-long-press", item && heldClicks === before + 1 && probe(0) === before + 11,
            `menu item ${item ? "shown" : "missing"}, clicks ${heldClicks} after the long press, ${probe(0)} after picking`);
        } else {
          check("touch", true, "skipped: this browser has no Touch / TouchEvent constructors");
        }

        // Wheel and resize don't throw, and resize re-renders at the new size.
        canvas.dispatchEvent(new WheelEvent("wheel", { deltaY: 120, bubbles: true, cancelable: true }));
        const presents = stats.presents;
        canvas.style.width = "600px";
        // ResizeObserver reports at the next rendering step.
        const nextFrame = () => new Promise((r) => requestAnimationFrame(r));
        for (let i = 0; i < 100 && canvas.width !== Math.round(600 * dpr); i++) await nextFrame();
        check("resize", canvas.width === Math.round(600 * dpr) && stats.presents > presents,
          `${canvas.width} px wide after resizing to 600 CSS px`);
        canvas.style.width = "";
        await sleep(200);

        const ok = Object.values(checks).every((c) => c.ok);
        const report = `SELFTEST: ${ok ? "ok" : "FAILED"}\n` + Object.entries(checks)
          .map(([k, c]) => `${c.ok ? "ok    " : "FAILED"} ${k}: ${c.detail}`).join("\n");
        console.log(report);
        document.getElementById("report").textContent = report;
        send(report);
        document.title = `selftest ${ok ? "ok" : "FAILED"}`;
      }

    </script>
  </body>
</html>
