[package]
name = "pointerdemo"
description = "Stipple example: prints every pointer and wheel event a custom element gets — used by CI to verify middle clicks, double clicks, horizontal scrolling and pointer-leave."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The browser build (the site's live examples): `src/web.rs` compiles
# `main.rs` as a wasm module that `web/stipple.js` runs.
[lib]
name = "pointerdemo_web"
path = "src/web.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
stipple.workspace = true

[lints]
workspace = true
