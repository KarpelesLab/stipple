[package]
name = "todo"
description = "Stipple example: the getting-started tutorial's todo list (docs/getting-started.md), with a headless --selftest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The browser build (the site's live examples): `src/web.rs` compiles
# `main.rs` as a wasm module that `web/stipple.js` runs.
[lib]
name = "todo_web"
path = "src/web.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
stipple.workspace = true

[lints]
workspace = true
