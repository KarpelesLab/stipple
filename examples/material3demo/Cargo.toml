[package]
name = "material3demo"
description = "Stipple example: a Material 3 (Material You) dynamic-color theme — baseline light/dark plus seed-recolored schemes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false


# The browser build (the site's live examples): `src/web.rs` compiles
# `main.rs` as a wasm module that `web/stipple.js` runs.
[lib]
name = "material3demo_web"
path = "src/web.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
stipple.workspace = true

[lints]
workspace = true
