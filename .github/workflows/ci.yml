name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch (or PR) cancels the run still going for the
# older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Vulkan shaders' checked-in SPIR-V must be what their GLSL compiles to
  # (tools/shaders.sh --check), with glslang at the release the script pins,
  # built here (a tool for this job only, never a dependency of the crate).
  shaders:
    name: SPIR-V matches the GLSL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache glslang
        id: glslang
        uses: actions/cache@v4
        with:
          path: ~/glslang
          key: glslang-16.6.0-noopt-${{ runner.os }}
      - name: Build glslang 16.6.0
        if: steps.glslang.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 16.6.0 https://github.com/KhronosGroup/glslang /tmp/glslang-src
          cmake -S /tmp/glslang-src -B /tmp/glslang-build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DENABLE_HLSL=OFF -DENABLE_SPVREMAPPER=OFF
          cmake --build /tmp/glslang-build --target glslang-standalone -j"$(nproc)"
          mkdir -p ~/glslang
          cp /tmp/glslang-build/StandAlone/glslang ~/glslang/
      - name: Recompile the shaders and compare
        run: GLSLANG=~/glslang/glslang tools/shaders.sh --check

  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # `cargo install stipple` gives `cargo stipple`: the published crate
      # carries the packaging scripts it runs.
      - name: the packaging tool is in the published crate
        run: |
          cargo package --list --allow-dirty > package-list.txt
          for f in tools/package/cargo-stipple tools/package/ios.py tools/package/helper.rs tools/android/billing.py src/bin/cargo-stipple.rs; do
            grep -qx "$f" package-list.txt || { echo "missing from the crate: $f"; exit 1; }
          done
      # `gpu`: the GPU examples need it (they're skipped without).
      - name: clippy
        run: cargo clippy --all-targets --features gpu -- -D warnings
      - name: clippy (tokio feature)
        run: cargo clippy --all-targets --features tokio -- -D warnings
      - name: test
        run: cargo test --features gpu
      - name: test (tokio feature)
        run: cargo test --features tokio
      - name: motiondemo selftest (animations at fixed times, off-screen)
        run: cargo run --example motiondemo -- --selftest
      - name: listmotion selftest (enter, exit and layout animations, off-screen)
        run: cargo run --example listmotion -- --selftest
      - name: listgestures selftest (swipe actions and pull to refresh, simulated touches)
        run: cargo run --example listgestures -- --selftest
      - name: todo selftest (the getting-started app, driven headless)
        run: cargo run --example todo -- --selftest target/todo.png
      - name: clippy (audio feature)
        run: cargo clippy --all-targets --features audio -- -D warnings
      - name: test (audio feature)
        run: "cargo test --features audio audio::"
      - name: audiodemo selftest (no sound card, the null output)
        run: STIPPLE_AUDIO=null cargo run --example audiodemo -- --selftest --expect-backend null
      # stipple::video: MPEG-2 decoded in software (oxideav), and H.264
      # saying Unsupported where there's no VA-API device (the runner has
      # none); the player shown off screen.
      - name: clippy (video feature)
        run: cargo clippy --all-targets --features video -- -D warnings
      - name: test (video feature)
        run: "cargo test --features video video::"
      - name: videoplayer selftest (the MPEG-2 clip decoded in software, off-screen)
        run: cargo run --example videoplayer --features video -- --selftest
      - name: gamedemo selftest (a seeded game played by script, its score and saves checked)
        run: STIPPLE_AUDIO=null cargo run --example gamedemo -- --selftest
      # The runners have no sound card: load ALSA's dummy driver (a card that
      # plays nothing, in real time) and play through libasound. Not blocking:
      # the runner's kernel may not have the module.
      - name: audiodemo selftest (ALSA, snd-dummy)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          sudo modprobe snd-dummy || {
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe snd-dummy
          }
          sudo chmod a+rw /dev/snd/* || true
          cat /proc/asound/cards
          cargo run --example audiodemo -- --selftest --expect-backend alsa

  # Gamepads on Linux: a virtual pad made through uinput
  # (.github/scripts/uinput-gamepad.py) must show up in `gamepaddemo --list`,
  # read through evdev. Non-blocking: runners may lack uinput.
  gamepad-linux:
    name: Gamepad (evdev, virtual uinput pad)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the gamepad demo
        run: cargo build --example gamepaddemo
      - name: List a virtual gamepad
        run: |
          sudo modprobe uinput || true
          sudo python3 .github/scripts/uinput-gamepad.py 20 &
          sleep 2
          out=$(sudo ./target/debug/examples/gamepaddemo --list)
          echo "$out"
          echo "$out" | grep -q "Stipple Virtual Pad \[1234:5678\]"

  msrv:
    name: MSRV 1.95 (library and examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (library and examples)
        run: cargo check --examples --features gpu

  # Static Linux binaries (docs/platforms/linux.md#static-builds). fullrust
  # (x86_64-unknown-linux-fullrust, no C library at all): the backends' libc
  # calls are raw syscalls and libraries load through the system's ld.so, so
  # audio plays through the runner's libasound (ALSA's dummy driver) and the
  # X11 and Wayland backends run under Xvfb and headless sway. A static musl
  # build can't load libraries: null audio, still a window. Not blocking yet.
  static-linux:
    name: Static Linux (fullrust, static musl)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb, sway, xdotool, libasound and a font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool sway seatd fonts-dejavu-core
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
      - name: Build for fullrust (the library with every feature, and examples)
        uses: KarpelesLab/fullrust@master
        with:
          args: >-
            --release --features gpu,vk,gl,audio,video
            --example audiodemo --example todo --example window --example touchdemo
            --example asyncdemo --example canvasdemo
      - name: The binaries are static, with no C library
        run: |
          # The action's container wrote Cargo.lock (and more) as root.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          for e in audiodemo window; do
            f=target/x86_64-unknown-linux-fullrust/release/examples/$e
            file "$f"
            if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then echo "$f is dynamic"; exit 1; fi
          done
      # A sound device: ALSA's dummy driver where the runner's kernel has it,
      # else PipeWire (a null sink, driven in real time) as ALSA's `default`
      # through its ALSA plugin, which libasound loads in turn. (Not
      # PulseAudio: libpulse's priority-inheriting mutexes abort when every
      # thread calls in under one foreign thread identity, see
      # docs/platforms/linux.md#static-builds.)
      - name: fullrust audiodemo selftest (ALSA through the system's libasound)
        continue-on-error: true
        run: |
          B="$PWD/target/x86_64-unknown-linux-fullrust/release/examples"
          STIPPLE_AUDIO=null $B/audiodemo --selftest --expect-backend null
          if sudo modprobe snd-dummy 2>/dev/null; then
            sudo chmod a+rw /dev/snd/* || true
            cat /proc/asound/cards
            $B/audiodemo --selftest --expect-backend alsa
          else
            sudo apt-get install -y -qq pipewire pipewire-alsa wireplumber dbus
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/pwrt"
            mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
            dbus-run-session -- bash -ec '
              pipewire > pipewire.log 2>&1 &
              sleep 1
              wireplumber > wireplumber.log 2>&1 &
              sleep 2
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=ci-null media.class=Audio/Sink object.linger=true audio.position=[ FL FR ] }"
              sleep 2
              wpctl status | head -40 || true
              "$0"/audiodemo --selftest --expect-backend alsa
            ' "$B"
          fi
      - name: fullrust under PulseAudio (the null output, not libpulse's abort)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq pulseaudio libasound2-plugins
          pulseaudio -D --exit-idle-time=-1
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          sleep 1
          pactl info | grep -E 'Server Name|Default Sink'
          target/x86_64-unknown-linux-fullrust/release/examples/audiodemo --selftest --expect-backend null
          rm ~/.asoundrc
      - name: fullrust todo selftest (off-screen)
        run: target/x86_64-unknown-linux-fullrust/release/examples/todo --selftest target/todo-fullrust.png
      - name: fullrust under Xvfb (window hints, icon, cursor, keyboard, timers)
        run: |
          B=target/x86_64-unknown-linux-fullrust/release/examples
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          export DISPLAY=:99
          STIPPLE_X11_DEBUG=1 $B/window > window.log 2>&1 &
          WIN=$!
          sleep 4
          xwininfo -root -tree | grep Stipple
          xprop -name Stipple WM_NORMAL_HINTS | grep -q 'minimum size: 400 by 320'
          xprop -name Stipple _NET_WM_ICON > icon.txt; grep -qE 'Icon \(64 x 64\)|= 64, 64' icon.txt
          xdotool mousemove 320 366; sleep 0.5; xdotool mousemove 600 20; sleep 0.5
          kill $WIN
          grep -q 'cursor Pointer' window.log
          $B/touchdemo > touch.log 2>&1 &
          TOUCH=$!
          sleep 4
          xdotool key Tab; sleep 0.5; xdotool key Tab; sleep 0.5
          xdotool key space; sleep 0.5; xdotool key Return; sleep 0.5
          xdotool key shift+Tab; sleep 0.5; xdotool type --delay 100 ok; sleep 1
          kill $TOUCH
          cat touch.log
          [ "$(grep -c '^touchdemo: row 0 tapped' touch.log)" -eq 2 ]
          grep -q '^touchdemo: text "ok"' touch.log
          timeout 30 $B/asyncdemo --selftest | tee async.log
          grep -q 'asyncdemo: ticks=10 result="10! = 3628800"' async.log
          timeout 30 $B/canvasdemo --selftest > canvas.log; grep -q 'canvasdemo: selftest ok' canvas.log
      - name: fullrust under headless sway (Wayland)
        run: |
          B=target/x86_64-unknown-linux-fullrust/release/examples
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdgrt"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          sudo seatd -g "$(id -gn)" > seatd.log 2>&1 &
          sleep 1
          export LIBSEAT_BACKEND=seatd
          printf 'output HEADLESS-1 resolution 1024x768\nexec sleep 600\n' > sway.cfg
          sway -c sway.cfg > sway.log 2>&1 &
          sleep 6
          export WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep -m1 '^wayland-[0-9]*$')
          unset DISPLAY
          STIPPLE_WAYLAND_DEBUG=1 timeout 30 $B/asyncdemo --selftest > wl-async.log 2>&1 || true
          tail -20 wl-async.log
          grep -q 'asyncdemo: ticks=10 result="10! = 3628800"' wl-async.log
          grep -q 'stipple wayland:' wl-async.log
          timeout 30 $B/canvasdemo --selftest > wl-canvas.log; grep -q 'canvasdemo: selftest ok' wl-canvas.log
      - name: Static musl build (null audio, a window under Xvfb)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --features audio \
            --example audiodemo --example todo --example window
          B=target/x86_64-unknown-linux-musl/release/examples
          file $B/audiodemo
          $B/audiodemo --selftest --expect-backend null
          $B/todo --selftest target/todo-musl.png
          DISPLAY=:99 $B/window > musl-window.log 2>&1 &
          WIN=$!
          sleep 4
          DISPLAY=:99 xwininfo -root -tree | grep Stipple
          kill $WIN

  # Verify the stack is mobile-portable: it cross-compiles for Android and iOS
  # with their native backends (NativeActivity, UIKit). Building the library
  # needs no NDK: nothing links until an app's cdylib does. The emulator and
  # simulator runs are in visual.yml.
  mobile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
            gpu: gl
          - target: aarch64-apple-ios
            os: macos-latest
            gpu: mtl
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (the library)
        run: cargo build --lib --target ${{ matrix.target }}
      # The benchmark runs on a phone too (its `transition` frames are held
      # to 120 Hz there, docs/performance.md); CI can only build it.
      - name: cargo check (the benchmark, with the GPU renderer)
        run: cargo check --example bench --features ${{ matrix.gpu }} --target ${{ matrix.target }}

  # The public API against docs/api-guidelines.md: #[non_exhaustive], options
  # structs, one path per item. rustdoc's JSON output is a nightly feature.
  api-audit:
    name: API audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc JSON
        run: cargo doc --no-deps --lib --features audio --target-dir target/apijson
        env:
          RUSTDOCFLAGS: -Z unstable-options --output-format json
      - name: Audit
        run: python3 .github/scripts/api-audit.py target/apijson/doc/stipple.json
