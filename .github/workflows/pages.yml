name: Pages

# Publish the site to GitHub Pages: https://karpeleslab.github.io/stipple/
#
# tools/site/build.py turns the README into the landing page and docs/ into
# the guides, with the examples running in them, and makes a gallery of every
# example that runs in the browser (listed, with how to build them, in
# tools/site/examples.toml). tools/site/check.py then opens each example in
# headless Chrome, which takes the gallery's thumbnails, and checks the
# site's links.
#
# The pages that were here before the site keep their URLs: webdemo.html (the
# web demo and its #selftest), multi.html (two apps on one page), webgpu.html
# (the WebGPU probe) and game.html (Lampwick, examples/gamedemo).

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "web/**"
      - "docs/**"
      - "examples/**"
      - "tools/site/**"
      - "README.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Every example is on the site or listed as native-only
        run: python3 tools/site/build.py check-manifest

      # All of them in one cargo invocation (the command is in examples.toml).
      - name: Build the web examples
        run: python3 tools/site/build.py wasm

      - name: Install a font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Generate the site
        run: python3 tools/site/build.py site --out site --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --strict

      # Thumbnails for the gallery, and a check that each example starts and
      # draws. An example that fails here gets no thumbnail (its card shows a
      # placeholder) but doesn't hold up the deployment.
      - name: Run the examples in headless Chrome
        run: python3 tools/site/check.py site --chrome google-chrome || echo "::warning::some examples failed in headless Chrome (see the log)"

      - name: Check the links
        run: python3 tools/site/check.py site --links

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
