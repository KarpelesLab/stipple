name: Pages

# Publish the web demo (examples/webdemo) to GitHub Pages:
# https://karpeleslab.github.io/stipple/ (multi.html: two apps on one page;
# webgpu.html: the WebGPU probe; game.html: Lampwick, the game in
# examples/gamedemo). The bundle is the one the visual-web CI job tests: the
# pages, web/stipple.js, the release wasm and a font.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "web/**"
      - "examples/webdemo/**"
      - "examples/gamedemo/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build the wasm modules
        run: |
          cargo build -p webdemo --target wasm32-unknown-unknown --release
          cargo build -p gamedemo --lib --target wasm32-unknown-unknown --release

      - name: Install a font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Assemble the site
        run: |
          mkdir -p site
          cp examples/webdemo/index.html examples/webdemo/multi.html examples/webdemo/webgpu.html web/stipple.js site/
          cp target/wasm32-unknown-unknown/release/webdemo.wasm site/
          cp examples/gamedemo/game.html target/wasm32-unknown-unknown/release/lampwick.wasm site/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf site/font.ttf
          # Serve the files as they are (no Jekyll processing).
          touch site/.nojekyll
          ls -l site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
