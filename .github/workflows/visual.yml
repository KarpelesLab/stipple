name: Visual

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) cancels the run still going for the
# older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  # Run the windowed example on a real Windows desktop (the runner has one) and
  # capture the screen to confirm the native Win32 backend creates a window and
  # blits the framebuffer.
  visual-windows:
    name: Visual test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the window example
        run: cargo build --release --example window

      - name: Exercise the raw Direct3D 11 (WARP) backend
        shell: bash
        run: |
          cargo run --release --example d3ddemo --features d3d | tee d3ddemo.log
          # WARP is always available on the runner, so a device must come up.
          grep -q "D3D11 device: WARP device" d3ddemo.log

      - name: Exercise the raw UI Automation provider
        shell: bash
        run: |
          cargo run --release --example uiademo | tee uiademo.log
          # The hand-built provider answers via its COM vtable: a server-side
          # provider (options 1) whose root is a Window control (50032), "Stipple".
          grep -q 'UIA provider: options=34 controltype=50032 name="Stipple"' uiademo.log
          # ...and the *full* element tree (not just the root) is navigable: a walk
          # via IRawElementProviderFragment::Navigate (FirstChild/NextSibling)
          # through real COM dispatch reaches a Text child (50020) and a Button
          # (50000) nested under a Group — proving the whole hierarchy is exposed.
          grep -q 'controltype=50020 name="Welcome to Stipple"' uiademo.log
          grep -q 'controltype=50000 name="OK"' uiademo.log
          # ...and GetFocus reports the focused TextField.
          grep -q 'UIA provider: focus="Name"' uiademo.log
          # ...and the field's placeholder is its HelpText (what Narrator and
          # NVDA read after an empty edit control).
          grep -q 'controltype=50004 name="Name" helptext="Your name"' uiademo.log
          grep -q 'UIA provider: focus helptext="Your name"' uiademo.log
          # ...and QueryInterface refuses the interfaces it doesn't implement
          # (IMarshal here), so COM and UIA never call into the wrong vtable.
          grep -q "UIA provider: QueryInterface refuses" uiademo.log
          # ...and each of its interfaces (…Simple, …Fragment, …FragmentRoot)
          # dispatches through a vtable of its own: the fragment interfaces
          # derive from IUnknown, not from …Simple.
          grep -q "UIA provider: each interface has its own vtable" uiademo.log

      # From outside the app, as Narrator reads it: the System.Windows.Automation
      # client walks a running touchdemo window (from its handle) through
      # UIA's cross-process channel, finds its button, field and label with
      # their bounds on screen, hit-tests a point, invokes the button through
      # its Invoke pattern (the app counts the tap and the tree follows), and
      # asks which element has keyboard focus after a Tab.
      - name: Read and drive a running window through UI Automation (out of process)
        shell: powershell
        run: |
          cargo build --release --example touchdemo
          .github\scripts\uia-walk.ps1 .\target\release\examples\touchdemo.exe visual_output
          # ...and a GPU-rendered frame must read back as the cleared stipple blue
          # (R=0x60 G=0x9c B=0xff A=0xff), checked tool-free from the printed pixel.
          grep -q "D3D11 readback: .* first pixel 96,156,255,255" d3ddemo.log
          # ...and a triangle drawn by HLSL shaders must put stipple green
          # (52,211,153) at the center pixel.
          grep -q "D3D11 triangle: .* center pixel 52,211,153,255" d3ddemo.log
          # ...and the shared-texture export (dma-buf analog) must run to
          # completion — its line appears whether WARP grants the shared handle or
          # declines it; absence would mean the COM call crashed.
          grep -q "D3D11 shared handle" d3ddemo.log

      # The control patterns and the events of a tree swap, from outside the
      # app (.github/scripts/uia-patterns.ps1): the field's Value and Text,
      # the "Remember" checkbox's Toggle, the list's and the strip's Scroll,
      # a row's ScrollItem, property- and structure-changed events, and the
      # toast a tap on "Row 2" raises. First the patterns in-process, each
      # through the interface GetPatternProvider hands out (uiademo
      # --patterns).
      - name: UI Automation patterns and events
        shell: powershell
        run: |
          cargo build --release --example uiademo --example touchdemo
          .\target\release\examples\uiademo.exe --patterns
          if ($LASTEXITCODE -ne 0) { throw "uiademo --patterns failed" }
          .github\scripts\uia-patterns.ps1 .\target\release\examples\touchdemo.exe visual_output

      - name: Timers and background work wake the event loop
        shell: bash
        run: |
          cargo build --release --example asyncdemo
          timeout 30 ./target/release/examples/asyncdemo.exe --selftest | tee async.log
          grep -q 'asyncdemo: ticks=10 result="10! = 3628800"' async.log
          grep -q 'asyncdemo: event loop exited' async.log

      - name: Titles, geometry and windows opened and closed at run time
        shell: bash
        env:
          OUT_DIR: visual_output
        run: |
          # Titles (GetWindowTextW), frames (GetWindowRect / GetClientRect)
          # and resize increments are read back from Win32 in the debug lines.
          cargo build --release --example multiwindow
          timeout 60 bash .github/scripts/runtime-windows.sh target/release/examples/multiwindow.exe log
          grep -q 'asyncdemo: spinner ok' async.log

      - name: A canvas repaints only the rows it invalidates
        shell: bash
        run: |
          cargo build --release --example canvasdemo
          timeout 30 ./target/release/examples/canvasdemo.exe --selftest | tee canvas.log
          grep -q 'canvasdemo: selftest ok' canvas.log

      # A transparent window (DWM's frame over the client area, the bitmap
      # premultiplied): at 0% background opacity what is behind shows, at
      # 100% the theme's background.
      - name: A transparent window
        shell: pwsh
        run: |
          cargo build --release --example glass
          foreach ($o in 0, 100) {
            .github\scripts\capture-window.ps1 -Exe target\release\examples\glass.exe `
              -Out "visual_output\glass-windows-$o.png" -Title "Glass" -Arguments "--opacity $o"
          }
          Add-Type -AssemblyName System.Drawing
          $clear = [System.Drawing.Bitmap]::new((Join-Path $PWD "visual_output\glass-windows-0.png")).GetPixel(30, 120)
          $solid = [System.Drawing.Bitmap]::new((Join-Path $PWD "visual_output\glass-windows-100.png")).GetPixel(30, 120)
          Write-Host "background at 0%: $clear, at 100%: $solid"
          if ($clear.ToArgb() -eq $solid.ToArgb()) { throw "the transparent window looked the same at 0% and 100%" }

      # The same window drawn with Direct3D 11 (WARP): a premultiplied
      # composition swap chain shown over the window through
      # DirectComposition. Over a magenta window: at 0% the magenta shows
      # through, at 70% it is blended as through the CPU's frame, at 100% it
      # doesn't show. Not blocking yet.
      - name: A transparent window presented with Direct3D 11 (non-blocking)
        continue-on-error: true
        shell: powershell
        run: |
          cargo build --release --features d3d --example glass
          # The magenta window, in a PowerShell of its own (the command
          # encoded, so its quotes survive the command line).
          $form = 'Add-Type -AssemblyName System.Windows.Forms; $f = New-Object System.Windows.Forms.Form; ' +
            '$f.Text = "Backdrop"; $f.BackColor = [System.Drawing.Color]::FromArgb(255, 0, 255); ' +
            '$f.FormBorderStyle = "None"; $f.StartPosition = "Manual"; ' +
            '$f.Bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; ' +
            '[System.Windows.Forms.Application]::Run($f)'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($form))
          $backdrop = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-STA', '-EncodedCommand', $encoded
          Start-Sleep -Seconds 5
          foreach ($r in 'd3d11', 'software') {
            foreach ($o in 0, 70, 100) {
              $env:STIPPLE_RENDERER = $r
              .github\scripts\capture-window.ps1 -Exe target\release\examples\glass.exe `
                -Out "visual_output\glass-$r-$o.png" -Title "Glass" -Arguments "--opacity $o" `
                -Log "visual_output\glass-$r-$o.log" -Topmost
            }
          }
          Remove-Item Env:\STIPPLE_RENDERER
          Stop-Process -Id $backdrop.Id -Force -ErrorAction SilentlyContinue
          Get-Content visual_output\glass-d3d11-70.log
          if (-not (Select-String -Path visual_output\glass-d3d11-70.log -Pattern 'stipple: presenting with Direct3D 11 straight to the window' -Quiet)) { throw 'not presented with Direct3D 11' }
          if (Select-String -Path visual_output\glass-d3d11-70.log -Pattern 'drawing on the CPU' -Quiet) { throw 'fell back to the CPU' }
          Add-Type -AssemblyName System.Drawing
          $px = @{}
          foreach ($r in 'd3d11', 'software') {
            foreach ($o in 0, 70, 100) {
              $bmp = [System.Drawing.Bitmap]::new((Join-Path $PWD "visual_output\glass-$r-$o.png"))
              $px["$r-$o"] = $bmp.GetPixel(30, 120)
              $bmp.Dispose()
            }
          }
          foreach ($o in 0, 70, 100) {
            $g = $px["d3d11-$o"]; $c = $px["software-$o"]
            Write-Host "background at ${o}%: Direct3D 11 $g, CPU $c"
            if ([Math]::Abs($g.R - $c.R) -gt 4 -or [Math]::Abs($g.G - $c.G) -gt 4 -or [Math]::Abs($g.B - $c.B) -gt 4) { throw "Direct3D 11 and the CPU differ at ${o}%" }
          }
          $clear = $px["d3d11-0"]
          if (-not ($clear.R -gt 200 -and $clear.G -lt 60 -and $clear.B -gt 200)) { throw "the magenta window doesn't show through at 0%: $clear" }
          if ($px["d3d11-0"].ToArgb() -eq $px["d3d11-100"].ToArgb()) { throw "the transparent window looked the same at 0% and 100%" }

      # The reference app (examples/mediabrowser): its selftest off screen
      # (PNG of each step) and in a real Win32 window; then its window
      # screenshotted, and its tree read through UI Automation from outside.
      - name: Media browser selftest
        shell: bash
        run: |
          mkdir -p visual_output
          cargo build --release --example mediabrowser
          timeout 180 ./target/release/examples/mediabrowser.exe --selftest --hold 4 \
            --out visual_output 2>&1 | tee visual_output/mediabrowser-selftest.log
          grep -q 'mediabrowser: selftest ok' visual_output/mediabrowser-selftest.log
          grep -q 'mediabrowser: window ok' visual_output/mediabrowser-selftest.log

      - name: Media browser window and UI Automation tree
        shell: pwsh
        run: |
          .github\scripts\capture-window.ps1 -Exe target\release\examples\mediabrowser.exe `
            -Out visual_output\mediabrowser-window-windows.png -Title "Media Browser" `
            -Arguments "--sample --select Pictures/sunset.png"
          .github\scripts\uia-roles.ps1 -Exe target\release\examples\mediabrowser.exe `
            -Title "Media Browser" -Arguments "--sample --select Music/chime.wav" -Out visual_output `
            -Expect "Tree|Folders","TreeItem|Music","DataGrid|Files","HeaderItem|Name","Button|Play","Slider|Position"

      - name: Round-trip text through the system clipboard
        shell: bash
        run: |
          cargo build --release --example clipboarddemo
          # Set CF_UNICODETEXT through stipple::platform::clipboard, read it back.
          timeout 30 ./target/release/examples/clipboarddemo.exe --roundtrip | tee clipboard.log
          grep -q 'clipboard roundtrip: ok' clipboard.log
          # ...and another process sees it on the OS clipboard.
          powershell -NoProfile -Command Get-Clipboard | tee os-clipboard.txt
          grep -q 'stipple clipboard .* round-trip' os-clipboard.txt

      - name: Round-trip HTML and an image through the system clipboard
        shell: bash
        run: |
          # CF_UNICODETEXT + "HTML Format" (CF_HTML) + CF_DIBV5 + "PNG", read back.
          timeout 30 ./target/release/examples/clipboarddemo.exe --roundtrip-rich | tee rich.log
          grep -q 'rich roundtrip: ok' rich.log
          # Another process sees each format (.NET decodes CF_HTML and the bitmap).
          powershell -NoProfile -STA -Command '
            Add-Type -AssemblyName System.Windows.Forms
            $d = [System.Windows.Forms.Clipboard]::GetDataObject()
            "formats: " + ($d.GetFormats() -join ",")
            [System.Windows.Forms.Clipboard]::GetText([System.Windows.Forms.TextDataFormat]::Html)
            $i = [System.Windows.Forms.Clipboard]::GetImage()
            "image: $($i.Width)x$($i.Height)"' | tee os-rich.txt
          grep -q 'HTML Format' os-rich.txt
          grep -q 'PNG' os-rich.txt
          grep -q 'StartFragment:' os-rich.txt
          grep -q '<b>stipple</b> rich <i>clipboard</i>' os-rich.txt
          grep -q 'image: 400x300' os-rich.txt
          # ...and the app reads what another process put there: a bitmap
          # (Windows synthesizes the DIBs from it), then HTML.
          powershell -NoProfile -STA -Command '
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $b = New-Object System.Drawing.Bitmap 32,16
            [System.Windows.Forms.Clipboard]::SetImage($b)'
          timeout 30 ./target/release/examples/clipboarddemo.exe --read | tee read.log
          grep -q 'image=32x16' read.log
          powershell -NoProfile -Command 'Set-Clipboard -Value "<i>from powershell</i>" -AsHtml'
          timeout 30 ./target/release/examples/clipboarddemo.exe --read | tee -a read.log
          grep -q 'html=".*<i>from powershell</i>' read.log

      # TSF: the thread manager activates, the field's window is tied to its
      # document, and a composition driven through the real TSF manager (the
      # app playing the input method: edit sessions, StartComposition,
      # SetText, EndComposition) reaches the field as preedit and commit,
      # through our ITextStoreACP and composition sink. No real IME runs:
      # none can be installed and scripted on the runner. STIPPLE_TSF=0 must
      # keep TSF off (IMM32).
      - name: Compose through the Text Services Framework
        shell: bash
        env:
          OUT_DIR: visual_output
        run: |
          cargo build --release --example textinput
          timeout 120 bash .github/scripts/tsf-windows.sh target/release/examples/textinput.exe

      - name: Drive the native menu bar and context menu
        shell: powershell
        run: |
          cargo build --release --example menudemo
          # Reads the HMENU back (GetMenu/GetMenuStringW), picks with
          # WM_COMMAND, Alt+E then a mnemonic, and Ctrl+D, opens the native
          # context menu (#32768) with a right-click and picks from it, and
          # checks menudemo's log saw each command exactly once.
          .github\scripts\menu-windows.ps1 .\target\release\examples\menudemo.exe visual_output

      # The drag starts on the script's own window and moves onto the
      # target, which it keeps on top (a console window can cover it on the
      # runner); its progress lines tell a loop that never turns from a
      # target that never answers.
      - name: Drop a file and text through OLE drag and drop
        shell: powershell
        timeout-minutes: 8
        run: |
          cargo build --release --example dropdemo
          New-Item -ItemType Directory -Force visual_output | Out-Null
          $file = Join-Path $env:RUNNER_TEMP 'dropped.txt'
          Set-Content -Path $file -Value 'hello'
          $app = Start-Process -FilePath .\target\release\examples\dropdemo.exe `
            -ArgumentList '--expect', '2', '--timeout', '90' -PassThru `
            -RedirectStandardOutput visual_output\drop.log `
            -RedirectStandardError visual_output\drop-err.log
          Start-Sleep -Seconds 4
          # Real OLE DoDragDrop from another process, onto the first zone; at
          # most 45 s each, so a stuck drag fails with its output, not a hang.
          function OleDrop([string[]]$DropArgs, [string]$Name) {
            $p = Start-Process -FilePath powershell -PassThru -NoNewWindow `
              -RedirectStandardOutput "visual_output\ole-$Name.log" `
              -ArgumentList (@('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
                '.github\scripts\ole-drop.ps1', '-Title', '"Stipple drop demo"') + $DropArgs)
            $null = $p.Handle  # keeps the exit code readable after it exits
            if (-not $p.WaitForExit(45000)) {
              Stop-Process -Id $p.Id -Force
              Write-Host "=== ole-drop ($Name) timed out ==="
              Get-Content "visual_output\ole-$Name.log" | Write-Host
              return 124
            }
            Get-Content "visual_output\ole-$Name.log" | Write-Host
            return $p.ExitCode
          }
          $filesCode = OleDrop @('-Files', "`"$file`"") 'files'
          Start-Sleep -Seconds 1
          $textCode = OleDrop @('-Text', '"hello from OLE"') 'text'
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id -Force }
          Write-Host '=== drop.log ==='; Get-Content visual_output\drop.log
          Write-Host '=== drop-err.log ==='; Get-Content visual_output\drop-err.log
          if ($filesCode -ne 0 -or $textCode -ne 0) { throw "ole-drop: files=$filesCode text=$textCode" }
          $log = Get-Content -Raw visual_output\drop.log
          if ($log -notmatch 'dropdemo: drop files \[.*dropped\.txt') { throw 'the file drop did not land' }
          if ($log -notmatch 'dropdemo: drop text "hello from OLE"') { throw 'the text drop did not land' }
          if ($log -notmatch 'dropdemo: selftest ok') { throw 'dropdemo did not finish' }

      - name: Screenshot the Stipple window and the native gallery
        shell: powershell
        run: |
          cargo build --release --example nativegallery
          .github\scripts\capture-window.ps1 .\target\release\examples\window.exe visual_output\stipple-windows.png
          .github\scripts\capture-window.ps1 .\target\release\examples\nativegallery.exe visual_output\stipple-windows-native.png

      # The native theme's real controls (docs/native-theme.md, "Real
      # controls"): nativegallery's self-test reads its BUTTON, trackbar and
      # progress child windows back and acts on them, picks a size from the
      # COMBOBOX (and one the app refuses goes back), checks the list's
      # half-scrolled rows stay live, cut by window regions, a real click on
      # Save and a real pick in the select's drop-down list (SendInput) reach
      # the app, a panel over the controls turns them into pictures
      # (screenshotted) and back, and UI Automation sees Save and Size once;
      # its text field is an EDIT that takes typing (WM_CHAR, then real keys)
      # into the app's state, follows the state the app sets, submits on
      # Return; UI Automation sees it once and MSAA names it by its hint.
      # Non-blocking until it has passed here a while.
      - name: Real OS controls (nativegallery self-test, a click, UIA)
        continue-on-error: true
        shell: powershell
        run: .github\scripts\native-views-windows.ps1

      # The same run's extras (docs/native-theme.md): the checkbox and the
      # radio buttons are live BUTTONs showing their own labels, read once by
      # UIA as a CheckBox with Toggle, and real clicks on them reach the app,
      # whose state sets their check; the wheel over a trackbar in a list
      # scrolls the list, not the slider, and a horizontal wheel moves the
      # slider. Non-blocking until it has passed here a while.
      - name: Real OS controls, extras (checkboxes, the wheel over a slider)
        continue-on-error: true
        shell: powershell
        run: |
          $r = Get-Content visual_output\native-views-extras.txt -ErrorAction SilentlyContinue
          Write-Host "native views extras: $r"
          if ($r -ne 'ok') { exit 1 }

      # A mirrored (right-to-left) UI: bididemo --mirror-check renders it off
      # screen with the system font and checks it is laid out from the right
      # (the same checks the X11 job makes on its screenshot); then a real
      # window of it is screenshotted.
      - name: Check the mirrored UI
        shell: bash
        run: |
          cargo build --release --example bididemo
          timeout 60 ./target/release/examples/bididemo.exe --mirror-check | tee bidi-mirror.log
          grep -q 'bididemo mirror: ok' bidi-mirror.log

      # System fonts found by scanning the Windows Fonts directories: the
      # `monospace` family (Cascadia Mono / Consolas / Courier New) in its four
      # styles, with decorations, rendered off screen and checked.
      - name: Check system fonts and decorations
        shell: bash
        run: |
          cargo build --release --example fontdemo
          ./target/release/examples/fontdemo.exe --list > fonts-list.log
          head -n 40 fonts-list.log
          grep -q 'Consolas\|Courier New' fonts-list.log
          timeout 60 ./target/release/examples/fontdemo.exe --check | tee fonts-check.log
          grep -q 'fontdemo: ok' fonts-check.log

      - name: Screenshot the mirrored UI
        shell: powershell
        run: |
          .github\scripts\capture-window.ps1 .\target\release\examples\bididemo.exe visual_output\stipple-windows-bidi-mirror.png -Title "Stipple - mirrored UI" -Arguments "--mirror"

      # The scene executor on Direct3D 11 (WARP on the runner, which has no
      # GPU) against the software renderer, pixel by pixel, with the same
      # tolerances as GLES2 and Metal (src/gpu/compare.rs); with
      # STIPPLE_REQUIRE_GPU the tests fail instead of skipping when there's no
      # device. Then the frame times, CPU against D3D11, for the log. The
      # gpu:: tests include an NV12 texture shared from another device, drawn
      # through two plane views without an upload (gpu::d3d::scene::external).
      - name: Compare the Direct3D 11 renderer with the software one
        shell: bash
        env:
          STIPPLE_REQUIRE_GPU: "1"
          STIPPLE_GPU_DUMP: visual_output/d3d-compare
        run: |
          mkdir -p visual_output/d3d-compare
          cargo test --features d3d --lib -- gpu:: app_gpu --nocapture --test-threads 1
          cargo test --release --features d3d --lib -- --ignored bench_cpu_against_gpu --nocapture
      # The native theme on Direct3D 11: the gallery with the controls uxtheme
      # draws, through D3D11 against the CPU at scales 1, 1.5 and 2 (the
      # comparison above also has a native-themed screen; this is the whole
      # gallery, as a window shows it).
      - name: Compare the native theme on Direct3D 11 with the software renderer
        shell: bash
        env:
          STIPPLE_RENDERER: d3d11
        run: |
          cargo run --release --features d3d --example nativegallery -- --gpu-check visual_output/d3d-compare | tee native-gpu.log
          grep -q 'nativegallery gpu: ok' native-gpu.log
      - name: Upload the Direct3D comparison frames
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stipple-windows-d3d-compare
          path: visual_output/d3d-compare/*
          if-no-files-found: warn

      # A real window drawn by Direct3D 11 and presented through its
      # flip-model DXGI swap chain; it must not fall back to the CPU.
      - name: Screenshot an app drawn with Direct3D 11
        shell: powershell
        env:
          STIPPLE_RENDERER: d3d11
        run: |
          cargo build --release --features d3d --example widgetsdemo
          .github\scripts\capture-window.ps1 .\target\release\examples\widgetsdemo.exe visual_output\stipple-windows-d3d.png -Title "Stipple Widgets" -Log visual_output\d3d-window.log
          Get-Content visual_output\d3d-window.log
          if (-not (Select-String -Path visual_output\d3d-window.log -Pattern 'stipple: drawing with Direct3D 11' -Quiet)) { throw 'not drawn with Direct3D 11' }
          if (Select-String -Path visual_output\d3d-window.log -Pattern 'drawing on the CPU' -Quiet) { throw 'fell back to the CPU' }

      # Frame pacing: DwmFlush on the CPU path, the swap chain's frame-latency
      # waitable object on Direct3D 11; idle, no presents and no wakeups. Not
      # blocking until it has passed on the runners (a virtual display's
      # compositor may not run at a real rate).
      - name: Frame pacing (CPU and Direct3D 11)
        continue-on-error: true
        shell: bash
        env:
          STIPPLE_DEBUG_FRAMES: "1"
        run: |
          cargo build --release --features d3d --example framepacing
          timeout 40 ./target/release/examples/framepacing.exe 2>&1 | tee visual_output/framepacing-cpu.log
          grep -q 'framepacing: ok' visual_output/framepacing-cpu.log
          STIPPLE_RENDERER=d3d11 timeout 40 ./target/release/examples/framepacing.exe 2>&1 | tee visual_output/framepacing-d3d11.log
          grep -q 'stipple: drawing with Direct3D 11' visual_output/framepacing-d3d11.log
          grep -q 'DXGI frame-latency waitable' visual_output/framepacing-d3d11.log
          grep -q 'framepacing: ok' visual_output/framepacing-d3d11.log

      # Occlusion (Phase 6a): minimized (IsIconic, and on Direct3D 11 the swap
      # chain's DXGI_STATUS_OCCLUDED), the animating window presents nothing
      # for 3 s, then draws again once restored.
      - name: A minimized window draws no frames (CPU and Direct3D 11)
        shell: bash
        env:
          STIPPLE_DEBUG_WINDOWS: "1"
        run: |
          timeout 40 ./target/release/examples/framepacing.exe --hidden 3 2>&1 | tee visual_output/framepacing-hidden-cpu.log
          grep -q 'framepacing: hidden ok, shown again ok' visual_output/framepacing-hidden-cpu.log
          STIPPLE_RENDERER=d3d11 timeout 40 ./target/release/examples/framepacing.exe --hidden 3 2>&1 | tee visual_output/framepacing-hidden-d3d11.log
          grep -q 'framepacing: hidden ok, shown again ok' visual_output/framepacing-hidden-d3d11.log

      # A game on the GPU: spritedemo's pixel-art frame drawn and scaled on
      # Direct3D 11 (WARP here), nothing uploaded each frame; its benchmark
      # there and on the CPU, for the log.
      - name: spritedemo drawn with Direct3D 11 (selftest, bench)
        shell: bash
        env:
          STIPPLE_RENDERER: d3d11
        run: |
          cargo build --release --features d3d --example spritedemo
          timeout 60 ./target/release/examples/spritedemo.exe --selftest 2>&1 | tee visual_output/spritedemo-d3d11.log
          grep -q 'stipple: drawing with Direct3D 11' visual_output/spritedemo-d3d11.log
          grep -q 'spritedemo selftest: .* after the warm-up 0 textures and 0 canvas bytes uploaded' visual_output/spritedemo-d3d11.log
          ! grep -q 'drawn with the software renderer' visual_output/spritedemo-d3d11.log
          timeout 300 ./target/release/examples/spritedemo.exe --bench 2>&1 | tee -a visual_output/spritedemo-d3d11.log
          STIPPLE_RENDERER=software timeout 300 ./target/release/examples/spritedemo.exe --bench 2>&1 | tee -a visual_output/spritedemo-d3d11.log

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stipple-windows-screenshot
          path: visual_output/*.png
          if-no-files-found: warn

  # The camera on the Android emulator (Camera2 through the NDK, no Java):
  # cameraview reports the permission not determined until it's granted
  # (pm grant), then opens the back camera, the emulator's emulated one
  # (hw.camera.back=emulated, a moving scene), and frames with a picture in
  # them reach its callback (examples/cameraview/test-on-device.sh). Not
  # blocking yet: the emulator's camera HAL is new ground here.
  camera-android:
    name: Camera (Android emulator, API 34)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build cameraview as an APK
        env:
          STIPPLE_APK_EXAMPLE: cameraview_android
          STIPPLE_APK_MANIFEST: examples/cameraview/AndroidManifest.xml
        run: bash examples/androiddemo/build-apk.sh x86_64 cameraview.apk

      # And with each GPU renderer, whose preview draws the camera's own
      # hardware buffers (examples/cameraview/test-gpu.sh): GLES through an
      # external texture, Vulkan through a sampler YCbCr conversion.
      - name: Build cameraview with GLES and with Vulkan
        env:
          STIPPLE_APK_EXAMPLE: cameraview_android
          STIPPLE_APK_MANIFEST: examples/cameraview/AndroidManifest.xml
        run: |
          STIPPLE_APK_FEATURES=gl bash examples/androiddemo/build-apk.sh x86_64 cameraview-gl.apk
          STIPPLE_APK_FEATURES=vk bash examples/androiddemo/build-apk.sh x86_64 cameraview-vk.apk

      # On the same emulator, a translucent window (examples/glass) over the
      # wallpaper, drawn on the CPU and with each GPU renderer
      # (examples/glass/test-android.sh).
      - name: Build glass on the CPU, with GLES and with Vulkan
        env:
          STIPPLE_APK_EXAMPLE: glass_android
          STIPPLE_APK_MANIFEST: examples/glass/AndroidManifest.xml
        run: |
          # (test-android.sh reads the screenshots' pixels with ImageMagick.)
          sudo apt-get install -y imagemagick
          bash examples/androiddemo/build-apk.sh x86_64 glass.apk
          STIPPLE_APK_FEATURES=gl bash examples/androiddemo/build-apk.sh x86_64 glass-gl.apk
          STIPPLE_APK_FEATURES=vk bash examples/androiddemo/build-apk.sh x86_64 glass-vk.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator (permission, frames)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          # An emulated back camera in the AVD too. (The action runs each
          # line on its own.)
          pre-emulator-launch-script: >-
            sed -i 's/^hw.camera.back=.*/hw.camera.back=emulated/' "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
            && grep -q '^hw.camera.back=emulated' "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
            || echo 'hw.camera.back=emulated' >> "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
          # Then the GPU renderers' previews, not blocking yet. (The action
          # runs each line on its own.)
          script: |
            bash examples/cameraview/test-on-device.sh cameraview.apk visual_output
            bash examples/cameraview/test-gpu.sh cameraview-gl.apk "OpenGL ES" visual_output/gl || echo "::warning::cameraview's preview didn't draw the camera's buffers with OpenGL ES (not blocking yet)"
            bash examples/cameraview/test-gpu.sh cameraview-vk.apk Vulkan visual_output/vk || echo "::warning::cameraview's preview didn't draw the camera's buffers with Vulkan (not blocking yet)"
            bash examples/glass/test-android.sh visual_output/glass glass.apk glass-vk.apk Vulkan glass-gl.apk "OpenGL ES" || echo "::warning::glass's translucent window differed between the CPU and the GPU renderers (not blocking yet)"

      - name: Upload the screenshot and log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stipple-android-camera
          path: |
            visual_output/*.png
            visual_output/*.log
            visual_output/*/*.png
            visual_output/*/*.log
          if-no-files-found: warn
