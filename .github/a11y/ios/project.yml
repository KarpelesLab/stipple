# A minimal Xcode project, generated by XcodeGen on the CI runner, holding
# one XCUITest bundle that drives the Stipple app (touchdemo, installed as
# com.karpeleslab.stipple) from outside its process, through the same
# accessibility (AX) channel VoiceOver uses. AXHost is an empty app, there
# only because an iOS UI-test bundle needs a target application; the test
# launches the Stipple app by its bundle id. See docs/accessibility.md.
name: StippleAX
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    # Simulator only: ad-hoc signing, no team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AXHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karpeleslab.stipple.axhost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  StippleAXTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AXHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karpeleslab.stipple.axtests
        TEST_TARGET_NAME: AXHost
schemes:
  StippleAXTests:
    build:
      targets:
        AXHost: all
        StippleAXTests: [test]
    test:
      targets:
        - StippleAXTests
