[package]
name = "stipple"
description = "Stipple: a cross-platform, self-drawn UI toolkit in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Keep the published crate to the library: no examples, screenshots or web glue.
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
# The raw GPU backends (`stipple::gpu`). Off by default.
gpu = []
# Each backend links system libraries, so each is opt-in. Without one, its entry
# points return an error.
gl = ["gpu"]  # EGL + GLES2
vk = ["gpu"]  # Vulkan (links libvulkan)
d3d = ["gpu"] # Direct3D 11, Windows-only
mtl = ["gpu"] # Metal, macOS-only
# `AppHandle::spawn`: run futures on a background tokio runtime and apply their
# output to the state. Not available on wasm32, where tokio has no threads.
tokio = ["dep:tokio"]
# `stipple::audio`'s decoders for compressed formats (Ogg Vorbis, MP3, FLAC,
# Opus), through oxideav. Off by default: they add compile time. Audio output,
# the mixer and plain PCM/float WAV are always there.
audio = [
    "dep:oxideav-basic",
    "dep:oxideav-ogg",
    "dep:oxideav-vorbis",
    "dep:oxideav-mp3",
    "dep:oxideav-flac",
    "dep:oxideav-opus",
]

[dependencies]
oxideav-core.workspace = true
oxideav-raster.workspace = true
oxideav-scribe.workspace = true
oxideav-svg.workspace = true
oxideav-image.workspace = true
oxideav-png.workspace = true
oxideav-mjpeg.workspace = true
oxideav-gif.workspace = true
oxideav-webp.workspace = true
oxideav-bmp.workspace = true
# Not used directly: a version floor. oxideav-image 0.0.5 asks for any pixfmt 0.1
# but needs APIs added in 0.1.11, so an older lockfile would fail to build.
oxideav-pixfmt.workspace = true
# Audio decoders (the `audio` feature).
oxideav-basic = { workspace = true, optional = true }
oxideav-ogg = { workspace = true, optional = true }
oxideav-vorbis = { workspace = true, optional = true }
oxideav-mp3 = { workspace = true, optional = true }
oxideav-flac = { workspace = true, optional = true }
oxideav-opus = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only the multi-threaded scheduler; apps enable the drivers they use (net, time,
# fs...) in their own tokio dependency, and the runtime turns those on.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["examples/*"]

[workspace.package]
version = "0.0.6"
edition = "2024"
# Floor is set by the oxideav stack: oxideav-scribe → oxideav-png → compcol
# requires rustc 1.88. (We'd happily target 1.86 otherwise.)
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KarpelesLab/stipple"
authors = ["Karpelès Lab Inc."]

[workspace.dependencies]
# Examples and the web target depend on the library at the repository root.
stipple = { version = "0.0.6", path = "." }

# --- oxideav media stack (the one sanctioned heavy dependency) ---
# Pure-Rust content rendering: scene graph, CPU rasterizer, font shaping,
# image decode, SVG. See ROADMAP.md §1 for the dependency policy.
oxideav-core = "0.1.27"
oxideav-raster = "0.1.3"
oxideav-scribe = "0.1.8"
oxideav-svg = "0.1.9"
# Image decode for `Pixmap::decode`: the oxideav-image gateway over a format
# registry the codec crates register into. Pinned below the releases that need
# rustc 1.95 (the MSRV-aware resolver would pick these anyway).
oxideav-image = "0.0.5"
oxideav-pixfmt = "0.1.11"
oxideav-png = "0.1.12"
oxideav-mjpeg = "0.1.13"
oxideav-gif = "0.0.14"
oxideav-webp = "0.3.1"
oxideav-bmp = "0.1.8"
# Audio decode for `stipple::audio` (the `audio` feature), at releases that
# build on our rustc 1.88 floor (newer ones need 1.95).
oxideav-basic = "0.0.11"
oxideav-ogg = "0.1.9"
oxideav-vorbis = "0.0.12"
oxideav-mp3 = "0.1.3"
oxideav-flac = "0.0.11"
oxideav-opus = "0.0.14"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
