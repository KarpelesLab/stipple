[package]
name = "stipple"
description = "Stipple: a cross-platform, self-drawn UI toolkit in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Keep the published crate to the library: no examples, screenshots or web glue.
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
# The raw GPU backends (`stipple::gpu`). Off by default.
gpu = []
# Each backend links system libraries, so each is opt-in. Without one, its entry
# points return an error.
gl = ["gpu"]  # EGL + GLES2
vk = ["gpu"]  # Vulkan (links libvulkan)
d3d = ["gpu"] # Direct3D 11, Windows-only
mtl = ["gpu"] # Metal, macOS-only
# `AppHandle::spawn`: run futures on a background tokio runtime and apply their
# output to the state. Not available on wasm32, where tokio has no threads.
tokio = ["dep:tokio"]

[dependencies]
oxideav-core.workspace = true
oxideav-raster.workspace = true
oxideav-scribe.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only the multi-threaded scheduler; apps enable the drivers they use (net, time,
# fs...) in their own tokio dependency, and the runtime turns those on.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["examples/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
# Floor is set by the oxideav stack: oxideav-scribe → oxideav-png → compcol
# requires rustc 1.88. (We'd happily target 1.86 otherwise.)
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KarpelesLab/stipple"
authors = ["Karpelès Lab Inc."]

[workspace.dependencies]
# Examples and the web target depend on the library at the repository root.
stipple = { version = "0.0.2", path = "." }

# --- oxideav media stack (the one sanctioned heavy dependency) ---
# Pure-Rust content rendering: scene graph, CPU rasterizer, font shaping,
# image decode, SVG. See ROADMAP.md §1 for the dependency policy.
oxideav-core = "0.1.27"
oxideav-raster = "0.1.2"
oxideav-scribe = "0.1.8"
oxideav-ttf = "0.1.6"
oxideav-otf = "0.1.2"
oxideav-svg = "0.1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
