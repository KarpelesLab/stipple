[package]
name = "stipple"
description = "Stipple: a cross-platform, self-drawn UI toolkit in Rust."
# Bumped by release-plz (release-plz.toml).
version = "0.0.6"
edition = "2024"
# Floor is set by the oxideav stack: oxideav-scribe → oxideav-png → compcol
# requires rustc 1.88. (We'd happily target 1.86 otherwise.)
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KarpelesLab/stipple"
authors = ["Karpelès Lab Inc."]
# Keep the published crate to the library: no examples, screenshots or web glue.
include = ["src/**/*", "tests/**/*", "docs/getting-started.md", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
# The raw GPU backends (`stipple::gpu`). Off by default.
gpu = []
# Each backend links system libraries, so each is opt-in. Without one, its entry
# points return an error.
gl = ["gpu"]  # EGL + GLES2
vk = ["gpu"]  # Vulkan (links libvulkan)
d3d = ["gpu"] # Direct3D 11, Windows-only
mtl = ["gpu"] # Metal, macOS-only
# `AppHandle::spawn`: run futures on a background tokio runtime and apply their
# output to the state. Not available on wasm32, where tokio has no threads.
tokio = ["dep:tokio"]
# `stipple::audio`'s decoders for compressed formats (Ogg Vorbis, MP3, FLAC,
# Opus), through oxideav. Off by default: they add compile time. Audio output,
# the mixer and plain PCM/float WAV are always there.
audio = [
    "dep:oxideav-basic",
    "dep:oxideav-ogg",
    "dep:oxideav-vorbis",
    "dep:oxideav-mp3",
    "dep:oxideav-flac",
    "dep:oxideav-opus",
]

# --- oxideav media stack (the one sanctioned heavy dependency) ---
# Pure-Rust content rendering: scene graph, CPU rasterizer, font shaping,
# image decode, SVG. See ROADMAP.md §1 for the dependency policy.
[dependencies]
oxideav-core = "0.1.27"
oxideav-raster = "0.1.3"
oxideav-scribe = "0.1.10"
# Not used directly: a version floor. CFF and CFF2 outlines (`.otf`, and the
# CJK collections Android, macOS and Linux ship) arrived in 0.1.8; scribe asks
# for any 0.1.
oxideav-ttf = "0.1.8"
oxideav-svg = "0.1.9"
# Image decode for `Pixmap::decode`: the oxideav-image gateway over a format
# registry the codec crates register into. Pinned below the releases that need
# rustc 1.95 (the MSRV-aware resolver would pick these anyway).
oxideav-image = "0.0.5"
oxideav-png = "0.1.12"
oxideav-mjpeg = "0.1.13"
oxideav-gif = "0.0.14"
oxideav-webp = "0.3.1"
oxideav-bmp = "0.1.8"
# Not used directly: a version floor. oxideav-image 0.0.5 asks for any pixfmt 0.1
# but needs APIs added in 0.1.11, so an older lockfile would fail to build.
oxideav-pixfmt = "0.1.11"
# Audio decode for `stipple::audio` (the `audio` feature), at releases that
# build on our rustc 1.88 floor (newer ones need 1.95).
oxideav-basic = { version = "0.0.11", optional = true }
oxideav-ogg = { version = "0.1.9", optional = true }
oxideav-vorbis = { version = "0.0.12", optional = true }
oxideav-mp3 = { version = "0.1.3", optional = true }
oxideav-flac = { version = "0.0.11", optional = true }
oxideav-opus = { version = "0.0.14", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only the multi-threaded scheduler; apps enable the drivers they use (net, time,
# fs...) in their own tokio dependency, and the runtime turns those on.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# --- Examples ---
#
# Each directory under examples/ is an example, `examples/NAME/main.rs`, run
# with `cargo run --example NAME`; what each shows is in
# tools/site/examples.toml. The entries below are only the ones that need
# settings: tests to run, features, and the libraries built for the browser
# and Android.

# Examples with tests, run by `cargo test`.
[[example]]
name = "audiodemo"
test = true

[[example]]
name = "bididemo"
test = true

[[example]]
name = "calculator"
test = true

[[example]]
name = "fontdemo"
test = true

[[example]]
name = "imagedemo"
test = true

[[example]]
name = "localedemo"
test = true

[[example]]
name = "menudemo"
test = true

[[example]]
name = "sessionsdemo"
test = true

[[example]]
name = "tabledemo"
test = true

[[example]]
name = "storedemo"
test = true

[[example]]
name = "todo"
test = true

[[example]]
name = "viewportdemo"
test = true

[[example]]
name = "widgetsdemo"
test = true

# The raw GPU backends: `--features gpu`, or a backend (gl, vk, d3d, mtl).
[[example]]
name = "d3ddemo"
required-features = ["gpu"]

[[example]]
name = "dmabuftest"
required-features = ["gpu"]

[[example]]
name = "dri3probe"
required-features = ["gpu"]

[[example]]
name = "gpudemo"
required-features = ["gpu"]

[[example]]
name = "gpuwindow"
required-features = ["gpu"]

[[example]]
name = "metaldemo"
required-features = ["gpu"]

# Libraries rather than programs.

# The web demo: a wasm module that examples/webdemo/index.html loads.
[[example]]
name = "webdemo"
path = "examples/webdemo/lib.rs"
crate-type = ["cdylib"]
test = true

# The web GPU renderer against the software one: a wasm module that
# examples/webdemo/gpucompare.html loads (CI runs it in headless Chrome).
[[example]]
name = "gpucompare"
path = "examples/webdemo/gpucompare.rs"
crate-type = ["cdylib"]
required-features = ["gpu"]

# Lampwick (examples/gamedemo) in the browser: lampwick.wasm, for game.html.
# `gamedemo` is the native program, which includes lib.rs as a module.
[[example]]
name = "lampwick"
path = "examples/gamedemo/lib.rs"
crate-type = ["cdylib"]

# An Android app: libandroiddemo.so, which examples/androiddemo/build-apk.sh
# packages as the libstipple_android.so its NativeActivity loads.
[[example]]
name = "androiddemo"
path = "examples/androiddemo/lib.rs"
crate-type = ["cdylib"]

# examples/cameraview as an Android app: libcameraview_android.so, which
# `STIPPLE_APK_EXAMPLE=cameraview_android examples/androiddemo/build-apk.sh`
# packages with examples/cameraview/AndroidManifest.xml.
[[example]]
name = "cameraview_android"
path = "examples/cameraview/android.rs"
crate-type = ["cdylib"]

# The examples in the browser (the site's live examples): each NAME_web
