# The examples (https://karpeleslab.github.io/stipple/examples/): what each
# shows, which run in the browser, and how they're built. tools/site/build.py
# and the Pages workflow both read this file; it's the one place that lists
# them.
#
# Every directory under examples/ is a Cargo example (`examples/NAME/main.rs`,
# `cargo run --example NAME`) and is either a [web.NAME] (built for wasm32 and
# run on the site, with a card in the gallery) or a [native.NAME] (listed with
# its source and what it needs). `build.py check-manifest` fails on one that
# is in neither, has no description, or whose wasm module isn't an
# [[example]] in Cargo.toml.

[build]
# One cargo invocation builds every web example: `args` is `arg` once per
# example, `{artifact}` its wasm module's name (a cdylib [[example]] in
# Cargo.toml). `out` is where the module lands. `--features gpu` builds the
# WebGPU / WebGL2 renderer in, for `?renderer=gpu` (docs/gpu.md).
command = "cargo build --release --target wasm32-unknown-unknown --features gpu {args}"
arg = "--example {artifact}"
out = "target/wasm32-unknown-unknown/release/examples/{artifact}.wasm"

# The environment the command runs in: how fast the modules run on the site
# (docs/performance.md#on-the-web). SIMD (every current browser has it),
# and one codegen unit and link-time optimization for the release profile.
[build.env]
CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS = "-C target-feature=+simd128"
CARGO_PROFILE_RELEASE_LTO = "true"
CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1"

# `build.py site` runs binaryen's wasm-opt on each module it copies when
# wasm-opt is on the PATH (or in $WASM_OPT), with these arguments; without
# it the modules are copied as built.
[build.wasm-opt]
args = ["-O2", "--strip-debug", "--strip-producers"]

# Every example has a `description`: one line about what it shows. Other
# [web.NAME] keys, all optional:
#   title     the card's title (default: NAME)
#   group     the gallery section
#   size      [width, height]: the CSS size it's shown at in guides and
#             thumbnails (the app fills whatever canvas it gets)
#   source    the file "View source" opens (default: main.rs)
#   artifact  the wasm module's name (default: NAME_web: the cdylib
#             [[example]] in Cargo.toml whose web.rs includes main.rs)
# [native.NAME] has `needs`: what it takes that a browser doesn't have.

