# --- Native only ---

[native.a11ydemo]
description = "Connect to D-Bus with the hand-written client in stipple::platform (the AT-SPI accessibility bridge foundation) and print the unique name."
needs = "Linux: talks to the AT-SPI accessibility bus over D-Bus."

[native.uiademo]
description = "Exercise the hand-written UI Automation provider in stipple::platform (the Windows accessibility bridge) and print what it returns."
needs = "Windows: the UI Automation provider."

[native.androiddemo]
description = "An Android app in a NativeActivity, with touch, keys, timers and animation (built as a cdylib for the APK)."
needs = "Android: a NativeActivity in an APK."

[native.intentresult]
description = "An Android app calling an API Stipple doesn't wrap through stipple::platform::android: VpnService.prepare's consent dialog, started for a result, whose answer survives the activity being recreated."
needs = "Android: a NativeActivity in an APK."

[native.androidservice]
description = "An Android app with its own Java Service and BroadcastReceiver, declared in a manifest fragment, calling into Rust through native methods (packaged by cargo-stipple)."
needs = "Android: an APK built by cargo-stipple."

[native.contentproc]
description = "A separate content process renders into shared memory, passed to the UI process and composited into a viewport (CPU dual of the GPU dma-buf path)."
needs = "Linux, macOS or Windows: a second process sharing memory with the UI."

[native.d3ddemo]
description = "Exercise the raw Direct3D 11 (WARP) backend in stipple::gpu and print what it created."
needs = "Windows: Direct3D 11."

[native.metaldemo]
description = "Exercise the raw Metal backend in stipple::gpu and print what it created."
needs = "macOS: Metal."

[native.gpudemo]
description = "Render a frame on the CPU, then route it through the GPU (stipple::gpu) and dump the read-back RGBA."
needs = "A GPU (EGL + GLES2, `--features gl`); it prints what it read back."

[native.gpuwindow]
description = "A real window whose frames are rendered on the GPU (stipple::gpu) and presented through the platform Surface."
needs = "A GPU (EGL + GLES2) and a native window."

[native.dmabuftest]
description = "Prove cross-process GPU surface sharing — export a GL texture as a dma-buf and re-import it (EGL_MESA_image_dma_buf_export / EGL_EXT_image_dma_buf_import)."
needs = "Linux: EGL dma-buf export and import."

[native.dri3probe]
description = "DRI3Open over the raw X11 socket -> the server's DRM fd -> bind that GPU via GBM and round-trip a dma-buf (DRI3 + Present groundwork)."
needs = "Linux: X11 with DRI3 and GBM."

[native.traydemo]
description = "A tray icon with a menu, a desktop notification, and opening URLs and files in their default apps."
needs = "A desktop with a system tray (Linux, Windows or macOS)."

[native.instancedemo]
description = "One instance per user: a second launch hands its arguments, directory and activation token to the running one and exits; on macOS, the Dock's reopen, files dropped on its icon, its menu, and the Window, Services and Help menus."
needs = "A desktop (Linux, Windows or macOS)."

[native.securestore]
description = "Store, read back and remove secrets with platform::secure_store: the Keychain, Credential Manager or the Secret Service, from a terminal."
needs = "The OS's secret store (the Keychain, Credential Manager, a Secret Service such as GNOME Keyring); the web has none."

[native.filedialog]
description = "Native file dialog via the xdg-desktop-portal FileChooser (D-Bus), with a built-in mock portal for headless verification."
needs = "A desktop's file dialog (the portal on Linux, IFileDialog, NSOpenPanel). The web demo opens and saves files in the browser."

[native.glass]
description = "A translucent window: the desktop shows through its background, whose opacity a slider sets, optionally blurred (--blur)."
needs = "A desktop window the compositor blends with what is behind it; the web's canvas is part of the page."

[native.multiwindow]
description = "Two real OS windows (X11), each a pane with its own view onto the shared app state."
needs = "A desktop: two OS windows on one state. The web has one canvas per app."

[native.ownedwindows]
description = "Windows that belong to another: a modal Preferences sheet, an owned tool window, a message box for one window, and a find bar that takes focus as it opens."
needs = "A desktop: windows owned by other windows. The web has one canvas per app."

[native.asyncdemo]
description = "Timers and background work updating the UI through an AppHandle."
needs = "Threads: it runs background work on a thread, which `wasm32-unknown-unknown` doesn't have."

[native.dropdemo]
description = "Dropping files and text from other applications, and dragging items inside the app."
needs = "A desktop: files and text dropped from other apps (the web backend doesn't take drops yet)."

[native.framepacing]
description = "Animates for three seconds, then idles for three: presents must follow the display's refresh, and the idle app must present nothing and never wake (docs/gpu.md#frame-pacing)."
needs = "A native window; `STIPPLE_RENDERER` picks the GPU path. It prints the frame counts and exits 1 when they're off."

[native.fontdemo]
description = "System fonts by family name, bold and italic faces (real or synthesized), a fallback chain, terminal metrics, and text decorations (underline styles, strikethrough, overline, colors)."
needs = "System fonts, found by family name; the web has only the font the page loads."

[native.bench]
description = "Stipple's benchmarks: frames, interactions, sprites, layout and text, timed on the software and GPU renderers, with a JSON report (docs/performance.md#benchmarks)."
needs = "A terminal: it prints a table and writes JSON. In the browser it runs from tools/bench/ instead."

[native.extensiondemo]
description = "An iOS app with a notification service extension written in Rust (its principal class made at run time), sharing files through an app group's container."
needs = "iOS: cargo-stipple packages the extension into the app's PlugIns/ (examples/extensiondemo/package.toml)."
