# The examples on the site (https://karpeleslab.github.io/stipple/): which
# run in the browser, and how they're built. tools/site/build.py and the Pages
# workflow both read this file; it's the one place that lists them.
#
# Every directory under examples/ is either a [web.NAME] (built for wasm32 and
# run on the site, with a card in the gallery) or a [native.NAME] (listed with
# its source and what it needs). `build.py check-manifest` fails on one that
# is in neither.

[build]
# One cargo invocation builds every web example: `args` is `arg` once per
# example, `{crate}` the example's package and `{artifact}` its wasm module's
# name. `out` is where the module lands.
command = "cargo build --release --target wasm32-unknown-unknown --lib {args}"
arg = "-p {crate}"
out = "target/wasm32-unknown-unknown/release/{artifact}.wasm"

# [web.NAME] keys, all optional:
#   title     the card's title (default: NAME)
#   description  one line about it (default: its Cargo.toml's)
#   group     the gallery section
#   size      [width, height]: the CSS size it's shown at in guides and
#             thumbnails (the app fills whatever canvas it gets)
#   source    the file "View source" opens (default: src/main.rs)
#   artifact  the wasm module's name (default: NAME_web: the [lib] in the
#             example's Cargo.toml, whose src/web.rs includes main.rs)
#   crate     the package to build (default: NAME)

